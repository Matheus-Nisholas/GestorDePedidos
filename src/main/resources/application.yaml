spring:
  application:
    name: gestao-pedidos

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

  flyway:
    enabled: true

jwt:
  secret: ${JWT_SECRET:gestao-pedidos-dev-secret-key-change-in-production-2026}
  expiration-hours: 2
